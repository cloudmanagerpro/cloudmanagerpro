spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 4
  jpa:
    properties:
      hibernate:
        format_sql: false

app:
  demo:
    enabled: ${ENABLE_DEMO_DATA:false}
  cors:
    allowed-origins: ${FRONTEND_URL}

logging:
  level:
    root: WARN
    com.cloudmanagerpro: INFO
