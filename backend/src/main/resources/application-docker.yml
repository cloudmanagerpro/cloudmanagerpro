spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

app:
  demo:
    enabled: ${ENABLE_DEMO_DATA:true}
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    com.cloudmanagerpro: INFO
