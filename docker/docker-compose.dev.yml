# =============================================================================
# CloudManagerPro — local development dependencies only
#
# This starts just the backing services (PostgreSQL + pgAdmin, optionally
# MailHog) so you can run the backend and frontend NATIVELY with hot reload and
# no image rebuilds:
#
#   docker compose -f docker-compose.dev.yml up -d
#   cd ../backend  && ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
#   cd ../frontend && npm install && npm run dev   # NEXT_PUBLIC_API_URL=http://localhost:8080/api
#
# Credentials here are LOCAL DEV defaults (not secrets) and match the backend's
# `local` profile (application-local.yml): db cloudmanagerpro / user cloudmanager.
#
# MailHog is optional — start it with: `... --profile mail up -d`
# =============================================================================

name: cloudmanagerpro-dev

volumes:
  pgdata_dev:

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloudmanagerpro}
      POSTGRES_USER: ${POSTGRES_USER:-cloudmanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudmanager}
    ports:
      # Published locally so the natively-run backend can reach it.
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloudmanager} -d ${POSTGRES_DB:-cloudmanagerpro}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@cloudmanagerpro.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 80
    ports:
      - "5050:80"
    depends_on:
      - postgres

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    profiles: ["mail"]
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # web UI
